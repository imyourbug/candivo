name: Deploy Laravel to VPS

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 1: Transfer files via SCP using Password
      - name: Copy files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: 22
          source: "."
          target: ${{ secrets.TARGET_DIR }}
          # We exclude files that shouldn't be overwritten or are handled by composer
          rm: false 
          strip_components: 0

      # Step 2: Run Laravel Commands via SSH
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          port: 22
          script: |
            cd ${{ secrets.TARGET_DIR }}
            
            # Install dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Run Migrations
            php artisan migrate:refresh --seed
            
            # Set Permissions (Crucial for Laravel storage/cache)
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # Clear and Cache Configs/Routes
            php artisan optimize:clear